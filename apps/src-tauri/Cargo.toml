[package]
name = "amoeba"
version = "0.6.5"
description = "Amoeba — local-first feed workbench (RSS / video / live / social)"
authors = ["zhh"]
edition = "2021"

[lib]
name = "amoeba_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# SQLite 存储(desktop/移动共用):sqlx 底层,经 JS bindings 走 StorageBackend。
# migration 不用插件的(Rust 侧)——DDL 归 core(db/schema.ts),与 CLI bun:sqlite 共用。
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "gzip"] }
base64 = "0.22"

# WebSocket 隧道(弹幕):tokio 提为正式依赖(dev 里那份可删)。
# native-tls:Windows 走 schannel;futures-util 给 StreamExt/SinkExt。
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "sync", "time", "macros"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"

# 抓取 webview 的 lane 窗口整理(去任务栏 / 屏外 / 隐藏):CDP `Target.createTarget`
# 在 WebView2 下会建独立顶层窗口，必须用 Win32 样式修正。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging"] }

# 自动更新只在桌面三平台编译(移动端没有安装器概念,updater/process 不参与)。
[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[dev-dependencies]
