[package]
name = "tauri-app"
version = "0.1.0"
description = "Tauri App — unified backend for desktop and mobile"
authors = ["you"]
edition = "2021"

[lib]
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "gzip"] }
base64 = "0.22"

# WebSocket 隧道(弹幕):tokio 提为正式依赖(dev 里那份可删)。
# native-tls:Windows 走 schannel;futures-util 给 StreamExt/SinkExt。
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "sync", "time", "macros"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
# 隐藏 Edge 窗口(SW_HIDE 启动):真实指纹 + 完全无感(含任务栏),反爬不暴露 headless。
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
