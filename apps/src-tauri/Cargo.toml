[package]
name = "tauri-app"
version = "0.1.0"
description = "Tauri App — unified backend for desktop and mobile"
authors = ["you"]
edition = "2021"

[lib]
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "gzip"] }
base64 = "0.22"

# WebSocket 隧道(弹幕):tokio 提为正式依赖(dev 里那份可删)。
# native-tls:Windows 走 schannel;futures-util 给 StreamExt/SinkExt。
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "sync", "time", "macros"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"

[dev-dependencies]
