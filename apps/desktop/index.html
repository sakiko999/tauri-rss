<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <!-- 复用应用图标(public/favicon.ico),消掉 /favicon.ico 的 404。
         ⚠️ 必须放 public/:写相对路径(如 ../../src-tauri/...)会随路由深度变,
         且生产构建不拷贝 → 打包后必 404。 -->
    <link rel="icon" href="/favicon.ico" />
    <title>RSS Reader — 订阅工作台</title>
    <script>
      /* 首帧前决定主题/密度/动效/字号，避免闪白。
       * 偏好在 localStorage(ui-prefs)，与 src/store/prefs.ts 共用同一形状。 */
      (function () {
        try {
          var p = JSON.parse(localStorage.getItem("ui-prefs") || "{}");
          var t = p.theme || "dark";
          if (t === "system") {
            t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          }
          var root = document.documentElement;
          root.dataset.theme = t;
          // data-prefs:空格分隔的开关列表(目前只有 railCollapsed)。★ 只给启动骨架用
          // (否则折叠侧栏的用户会先看到 268px 的骨架栏再跳成 64px);
          // React 的首帧标记不带 data-prefs,CSS 侧一律 `~=` 匹配,不会被它污染。
          if (p.railCollapsed) root.dataset.prefs = "rail-collapsed";
          if (p.density) root.dataset.density = p.density;
          if (p.motion) root.dataset.motion = p.motion;
          if (p.measure) root.dataset.measure = p.measure;
          if (p.fontSize) root.style.setProperty("--article-fs", p.fontSize + "px");
        } catch (e) {}
      })();
    </script>

    <!--
      boot-skeleton —— 启动过渡期的骨架屏(纯 HTML/CSS,不含 JS)。

      ⚠️ 为什么不能放 JS 里:Vite 的 dev 脚本是 `type=module`,动态 import 整张依赖图
      要 ~1.1s 才开始执行(真机量到 readyState=interactive 之后还有 800ms 是**纯空白**),
      任何 JS 方案都补不上这段。所以骨架必须是 index.html 里的静态标记。

      ⚠️ 下面的类名与颜色字面量都是**故意**写死的:这份 CSS 只有在已注入的 ui-prefs
      带 theme / density / motion 时才生效,否则不参与渲染(两侧都实测过)。
      - 改主题色 → 同步 theme.css 的 --bg / --surface-1/2/3
      - 改密度/折叠态 → 同步 prefs.ts 的默认值与 BootSkeleton.tsx
      调色板刻意**不接**主题令牌:那些令牌在 CSS 加载前还不存在。

      ⚠️ `.bs-*` 这套类名被 App 侧复用(components/BootSkeleton.tsx 的 GridSkeleton
      盖在 .boot-overlay 里),所以这份 CSS 不只是「静态骨架自己的」——改它两边都变。
    -->
    <style>
      /**
       * ⚠️ 这一条**必须**有,而且是这份内联样式里最关键的一行。
       *
       * Tailwind 4 的 preflight 里有 `*, ::before, ::after { box-sizing: border-box }`,
       * 但它要等 CSS bundle 到位才生效 —— 在那之前,骨架按浏览器默认的 **content-box** 算:
       * `.bs-rail` 的 `width: 268px` 会**再加上** `.bs-sec` 的左右 padding(各 16px)
       * 与右边框,实测第一帧是 **301px**,CSS 一到就变回 268px。
       * 用户看到的就是「骨架侧栏从一个较大的宽度 → 跳成实际宽度 → 再到真实侧栏」。
       * 这里先补同一条,让 bundle 前的那一帧与最终态完全一致。
       */
      *,
      ::before,
      ::after {
        box-sizing: border-box;
      }

      /* ⚠️ 调色板变量必须挂在 **:root** 上,不能挂在 `.boot-skeleton` 上 ——
         App 侧的 `.boot-overlay`(App.tsx 的 booting)也复用这同一套 `.bs-*` 类名,
         但它**不是** `.boot-skeleton` 的后代。变量若只挂在那上面,overlay 里的
         `var(--bs-muted)` 全部取不到 → `linear-gradient(90deg, , , )` 整条声明失效
         → 卡片透明,用户看到的是**一片空白的正文区**(实测复现)。 */
      :root {
        --bs-surface: oklch(0.207 0.007 72);
        --bs-muted: oklch(0.245 0.008 72);
        --bs-line: oklch(0.285 0.009 72);
        --bs-bg: oklch(0.168 0.006 72);
        /* ⚠️ 必须把底色**应用到画布**:只定义 --bs-bg 而不用它,html/body 的背景就是
           透明的(rgba(0,0,0,0)),画布回落到浏览器默认的**白色** —— 而 styles.css 的
           `body{background:var(--bg)}` 要等 Tailwind 编译产物加载后才生效。于是深色主题下
           启动时白闪一下(骨架本身是深色,闪的是**画布**,不是骨架)。实测确证:
           html/body 的 computed background 曾是 rgba(0,0,0,0)。
           写在 :root 上会传播到**画布**(html 的背景是整个视口),fixed 的骨架盖不住这一层。 */
        background: var(--bs-bg);
      }
      /* ⚠️ 首帧脚本(上面那段内联 JS)在 CSS 之前就设好了 data-theme,所以正常路径
         走下面两条即可;`html:not([data-theme])` 那条兜底「脚本被禁/尚未执行」。 */
      [data-theme="light"] {
        --bs-surface: oklch(1 0 0);
        --bs-muted: oklch(0.965 0.005 75);
        --bs-line: oklch(0.935 0.006 75);
        --bs-bg: oklch(0.985 0.003 75);
      }
      html:not([data-theme]) {
        --bs-surface: light-dark(oklch(1 0 0), oklch(0.207 0.007 72));
        --bs-muted: light-dark(oklch(0.965 0.005 75), oklch(0.245 0.008 72));
        --bs-line: light-dark(oklch(0.935 0.006 75), oklch(0.285 0.009 72));
        --bs-bg: light-dark(oklch(0.985 0.003 75), oklch(0.168 0.006 72));
      }

      .boot-skeleton {
        /* ⚠️ 必须 fixed 覆盖,不能留在正常流里:#root 是它的兄弟节点,留在流里会把
           应用整体顶到首屏之下 —— 骨架淡出时露出来的就是一片空背景,而不是应用。 */
        position: fixed;
        inset: 0;
        z-index: 999;
        display: flex;
        flex-direction: column;
        background: var(--bs-bg);
      }
      .bs-bar,
      .bs-card {
        background: linear-gradient(90deg, var(--bs-muted), var(--bs-line), var(--bs-muted));
        background-size: 200% 100%;
        animation: bs-shimmer 1.4s ease-in-out infinite;
      }
      @keyframes bs-shimmer {
        from {
          background-position: 150% 0;
        }
        to {
          background-position: -50% 0;
        }
      }
      html[data-motion="off"] .bs-bar,
      html[data-motion="off"] .bs-card {
        animation: none;
      }

      .bs-bar {
        height: 16px;
        border-radius: 6px;
      }
      .bs-topbar {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
        align-items: center;
        gap: 12px;
        height: 52px;
        flex: none;
        padding-inline: 12px;
        background: var(--bs-surface);
        border-bottom: 1px solid var(--bs-line);
      }
      .bs-chip {
        width: min(420px, 40vw);
        height: 28px;
        border-radius: 999px;
      }
      .bs-icons {
        display: flex;
        gap: 10px;
      }
      .bs-icons .bs-bar {
        width: 20px;
        height: 20px;
        border-radius: 999px;
      }
      .bs-body {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
      }
      .bs-sec {
        display: grid;
        gap: 12px;
        padding: 16px;
      }
      .bs-rail {
        width: 268px;
        flex: none;
        background: var(--bs-surface);
        border-right: 1px solid var(--bs-line);
      }
      /* ⚠️ 两个收窄条件必须**同时**有,且宽度与断点都要跟 styles.css 同步:
         - 用户手动折叠侧栏 → html[data-prefs~="rail-collapsed"](首帧脚本写入)
         - 窗口窄(真实 CSS 是 `@media (max-width:1080px) { --rail: 64px }`)
         缺任一条件,骨架都是 268px 而真实侧栏 64px → 骨架淡出时**侧栏宽度跳变**
         (真机量到视口 1000px 时骨架 268 vs 真实 64,差 204px)。
         这份 CSS 是静态内联的,看不到 styles.css 的断点,只能各写一遍。 */
      html[data-prefs~="rail-collapsed"] .bs-rail {
        width: 64px;
      }
      @media (max-width: 1080px) {
        .bs-rail {
          width: 64px;
        }
        html[data-prefs~="rail-collapsed"] .bs-label,
        .bs-label {
          visibility: hidden;
        }
      }
      html[data-prefs~="rail-collapsed"] .bs-label {
        visibility: hidden;
      }
      .bs-main {
        flex: 1 1 auto;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .bs-title {
        width: 180px;
        height: 22px;
      }
      .bs-grid {
        flex: 1 1 auto;
        min-height: 0;
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(auto-fill, minmax(252px, 1fr));
        align-content: start;
        padding: 0 24px 32px;
      }
      .bs-card {
        aspect-ratio: 16 / 9;
        border-radius: 12px;
      }
      /* 列表形态(文章节点用):行骨架,与 Virtuoso 的列表行同构。 */
      .bs-list {
        flex: 1 1 auto;
        min-height: 0;
        display: grid;
        gap: 12px;
        align-content: start;
        padding: 0 24px 32px;
      }
      .bs-row {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .bs-thumb {
        width: 40px;
        height: 40px;
        flex: none;
        border-radius: 8px;
      }
      .bs-row-lines {
        flex: 1 1 auto;
        min-width: 0;
        display: grid;
        gap: 8px;
      }
      /* 淡出:React 首帧替换掉骨架时由 main.tsx 加 .boot-skeleton-out。
         ⚠️ 只动 opacity,**不要**动 visibility —— 它跑到 0 之后才会在 240ms 时被
         remove() 摘除;一旦中途被打断(热重载),元素还得能被看见。 */
      .boot-skeleton-out {
        animation: bs-out 160ms ease-in forwards;
      }
      @keyframes bs-out {
        to {
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-skeleton-out {
          animation: none;
          opacity: 0;
        }
      }
    </style>
  </head>

  <body>
    <a class="skip-link" href="#main-region">跳到主要内容</a>
    <div id="boot-skeleton" class="boot-skeleton" aria-hidden="true">
      <div class="bs-topbar">
        <div class="bs-bar" style="width: 220px"></div>
        <div class="bs-bar bs-chip"></div>
        <div class="bs-icons">
          <span class="bs-bar"></span><span class="bs-bar"></span><span class="bs-bar"></span><span class="bs-bar"></span
          ><span class="bs-bar"></span>
        </div>
      </div>
      <div class="bs-body">
        <!-- 侧栏栏体只在这儿(静态骨架里):真正的侧栏一进来就有内容(订阅列表/导航),
             不需要在 React 里再造一份骨架去换它 —— 那反而会跟真侧栏错拍。 -->
        <aside class="bs-sec bs-rail">
          <span class="bs-bar bs-label" style="width: 64px; height: 11px"></span>
          <span class="bs-bar bs-label" style="width: 84%"></span>
          <span class="bs-bar bs-label" style="width: 82%"></span>
          <span class="bs-bar bs-label" style="width: 86%"></span>
          <span class="bs-bar bs-label" style="width: 78%"></span>
          <span class="bs-bar bs-label" style="width: 84%"></span>
          <span class="bs-bar bs-label" style="width: 80%"></span>
          <span class="bs-bar bs-label" style="width: 76%"></span>
        </aside>
        <main class="bs-main">
          <div class="bs-sec" style="padding-bottom: 8px">
            <span class="bs-bar bs-title"></span>
          </div>
          <!-- ⚠️ 卡片数必须与 components/BootSkeleton.tsx 的 SKELETON_COUNT 一致
               (12)。曾写 8,与 App 侧骨架交接时卡片会从 8 张跳成 12 张,肉眼可见。 -->
          <div class="bs-grid">
            <div class="bs-card"></div>
            <div class="bs-card"></div>
            <div class="bs-card"></div>
            <div class="bs-card"></div>
            <div class="bs-card"></div>
            <div class="bs-card"></div>
            <div class="bs-card"></div>
            <div class="bs-card"></div>
            <div class="bs-card"></div>
            <div class="bs-card"></div>
            <div class="bs-card"></div>
            <div class="bs-card"></div>
          </div>
        </main>
      </div>
    </div>
    <div id="root"></div>
    <div id="overlay-root" class="overlay-root"></div>
    <div id="toast-root" class="toast-root" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
